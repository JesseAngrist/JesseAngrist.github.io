<h2>Piranesi</h2>
<p><em>Susanna Clarke, 2020</em></p>
<p>
  A man lives alone in a House of infinite halls and statues, cataloguing the tides.
  The topology of the House is both prison and home. He knows every room.
</p>
<p>
  I think about this book often when I am in a place I know very well.
</p>
